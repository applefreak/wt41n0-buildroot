# Publish the WebUSB flasher (support/flasher/) on GitHub Pages:
# https://applefreak.github.io/wt41n0-buildroot/
# with the latest release's wt41n0-install.hex in latest/, for the page's "Use the
# latest release" button (the page cannot fetch release files from github.com).
# One-time setup: repository Settings -> Pages -> Source: GitHub Actions.
# build.yml starts this workflow after it publishes a release: a release made with the
# workflow token does not fire the "release" event.
name: Web Flasher

on:
  push:
    branches: [main]
    paths: ['support/flasher/**', '.github/workflows/pages.yml']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the web flasher
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/latest
          cp -r support/flasher/. _site/
          # The newest published release (no drafts or prereleases) that already has the
          # image attached: a release made by hand gets its files only when build.yml
          # finishes, about an hour later, and is skipped until then (build.yml starts
          # this workflow again once they are there). None = no button on the page.
          IMG=wt41n0-install.hex
          tag=""
          for t in $(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts \
                       --exclude-pre-releases --limit 30 --json tagName -q '.[].tagName'); do
            if gh release view "$t" --repo "$GITHUB_REPOSITORY" --json assets \
                 -q '.assets[].name' | grep -qx "$IMG"; then
              tag=$t; break
            fi
            echo "release $t has no $IMG (yet): skipped"
          done
          if [ -n "$tag" ]; then
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$IMG" --dir _site/latest
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,publishedAt \
              -q "{tag: .tagName, date: .publishedAt, file: \"$IMG\"}" > _site/latest/release.json
            cat _site/latest/release.json
          else
            echo "no release with $IMG: publishing the flasher without the latest-release button"
          fi
          ls -la _site _site/latest
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
