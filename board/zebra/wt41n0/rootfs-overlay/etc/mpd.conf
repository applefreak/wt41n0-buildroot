# MPD on the WT41N0. Controlled only on the unit, through the Unix socket below:
# the Music app (wt41n0-music) and mpc. No TCP port is opened.
#
# Music: copy files into /root/Music (scp -r ... root@<unit>:/root/Music/); the
# database updates itself. Radio: .m3u playlists of stream URLs in
# /root/Music/Playlists, or add a URL in the Music app.

music_directory		"/root/Music"
playlist_directory	"/root/Music/Playlists"
db_file			"/var/lib/mpd/database"
state_file		"/var/lib/mpd/state"
log_file		"syslog"
pid_file		"/var/run/mpd.pid"

bind_to_address		"/run/mpd.socket"

auto_update		"yes"
restore_paused		"yes"
follow_outside_symlinks	"yes"
follow_inside_symlinks	"yes"

# The built-in speaker, through /etc/asound.conf's "default" (it converts to the
# 32-bit 88.2/96 kHz the codec takes). The volume is the codec's "Handsfree" control,
# the same one Settings changes.
audio_output {
	type		"alsa"
	name		"Speaker"
	device		"default"
	mixer_type	"hardware"
	mixer_device	"default"
	mixer_control	"Handsfree"
}

filesystem_charset	"UTF-8"
