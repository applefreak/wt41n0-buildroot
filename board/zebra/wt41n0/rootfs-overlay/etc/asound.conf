# ALSA defaults for the WT41N0.
#
# The sound hardware only takes 32-bit samples at 88.2 or 96 kHz, and the
# built-in speaker is on McPDM channels 3 and 4. "default" hides both: any
# sample format and rate is converted, stereo is routed to the speaker, and
# recording comes from the built-in digital microphone.
#
#   aplay file.wav           built-in speaker
#   arecord -f cd out.wav    built-in microphone
#   aplay -D headset ...     headset (McPDM channels 1 and 2, untested)

# Stereo -> McPDM channels 3 and 4. The plug in front of it converts the
# sample rate (the route plugin itself cannot) and the format.
pcm.speaker_route {
	type route
	slave {
		pcm "hw:0,0"
		channels 4
		format S32_LE
	}
	ttable.0.2 1
	ttable.1.3 1
}

pcm.speaker {
	type plug
	slave.pcm "speaker_route"
}

pcm.headset {
	type plug
	slave {
		pcm "hw:0,0"
		channels 2
		format S32_LE
		rate 96000
	}
}

pcm.mic {
	type plug
	slave {
		pcm "hw:0,1"
		channels 2
		format S32_LE
		rate 96000
	}
}

pcm.!default {
	type asym
	playback.pcm "speaker"
	capture.pcm "mic"
}

ctl.!default {
	type hw
	card 0
}
